<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the notch/home-indicator insets to
         env(safe-area-inset-*); interactive-widget=resizes-content keeps the
         soft keyboard from shrinking the visual viewport out from under a
         sheet. Money entry avoids the OS keyboard entirely (see Numpad). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#050607" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Autonomous precision, sovereign wealth." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sovereign" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Sovereign</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
